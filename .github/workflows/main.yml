name: Chotu Wala Flask CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  test:

    runs-on: ubuntu-latest

    services:

      mysql:
        image: mysql:8.0

        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: chotu_walad
          MYSQL_USER: chotu_user
          MYSQL_PASSWORD: chotu_password

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall .

      - name: Test MySQL connection
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: chotu_user
          DB_PASSWORD: chotu_password
          DB_NAME: chotu_walad
        run: |
          python -c "import mysql.connector; c=mysql.connector.connect(host='127.0.0.1', port=3306, user='chotu_user', password='chotu_password', database='chotu_walad'); print('MySQL Connected Successfully'); c.close()"

      - name: Run tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: chotu_user
          DB_PASSWORD: chotu_password
          DB_NAME: chotu_walad
        run: |
          python -m pytest
